name: Carparks tests

on:
  push:
    branches: [master]
    paths: ['main.py', 'templates/**', 'static/**', 'scripts/**', 'tests/**', 'index.html', 'hdb-carpark-information.csv', 'requirements.txt', 'package.json', '.github/workflows/carparks-tests.yml']
  pull_request:
    branches: [master]
    paths: ['main.py', 'templates/**', 'static/**', 'scripts/**', 'tests/**', 'index.html', 'hdb-carpark-information.csv', 'requirements.txt', 'package.json', '.github/workflows/carparks-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carparks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Flask and CSV behavior
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test browser search and download limits
        run: npm test
      - name: Verify generated Pages assets
        run: python scripts/build_pages.py --check
